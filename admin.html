<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Growth · The Veil</title>
<meta name="robots" content="noindex"><link rel="icon" href="data:,">
<style>
  :root{--ink:#0d0f14;--ink-soft:#3a3d47;--ink-muted:#7a7e8a;--surface:#f7f6f3;--surface2:#efedea;--border:#e2e0dc;--accent:#b07d1e;--green:#00875a;--apple:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Helvetica,Arial,sans-serif;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--apple);background:var(--surface);color:var(--ink);line-height:1.55}
  nav{background:#fff;border-bottom:1px solid var(--border);display:flex;justify-content:center;height:58px}
  .nav-in{width:100%;max-width:980px;padding:0 22px;display:flex;align-items:center;justify-content:space-between}
  .logo{display:flex;align-items:center;gap:9px;text-decoration:none}
  .logo-mark{width:30px;height:30px;background:#0d0f14;border-radius:7px;display:flex;align-items:center;justify-content:center;color:var(--accent)}
  .logo-text{font-size:15px;font-weight:600;color:#0d0f14}.logo-text span{color:var(--accent)}
  .stamp{font-size:12px;color:var(--ink-muted)}
  .wrap{max-width:980px;margin:0 auto;padding:30px 22px 70px}
  h1{font-size:25px;font-weight:600;letter-spacing:-.4px;margin-bottom:3px}
  .sub{font-size:14px;color:var(--ink-muted);margin-bottom:24px}
  .cards{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:26px}
  .card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:18px 20px}
  .card .k{font-size:12px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--ink-muted);margin-bottom:8px}
  .card .v{font-size:32px;font-weight:700;letter-spacing:-1px;line-height:1}
  .card .m{font-size:12.5px;color:var(--ink-muted);margin-top:6px}
  .card .v.accent{color:var(--accent)}.card .v.green{color:var(--green)}
  .panel{background:#fff;border:1px solid var(--border);border-radius:14px;padding:22px 24px;margin-bottom:20px}
  .panel h2{font-size:13px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--ink-muted);margin-bottom:16px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
  .legend{display:flex;gap:18px;margin-top:12px;font-size:13px;color:var(--ink-soft);flex-wrap:wrap}
  .legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px;vertical-align:-1px}
  .rows{display:flex;flex-direction:column;gap:2px}
  .row{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--surface)}
  .row:last-child{border-bottom:none}
  .row .nm{flex:1;font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row .bar{flex:none;width:120px;height:8px;background:var(--surface);border-radius:99px;overflow:hidden}
  .row .bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
  .row .n{flex:none;width:34px;text-align:right;font-size:13.5px;font-weight:700;color:var(--ink-soft)}
  .empty{font-size:13.5px;color:var(--ink-muted);padding:8px 0}
  .gate{max-width:420px;margin:80px auto;background:#fff;border:1px solid var(--border);border-radius:16px;padding:34px 30px;text-align:center}
  .gate h1{font-size:20px;margin-bottom:8px}.gate p{font-size:14px;color:var(--ink-muted)}
  .gate input{width:100%;margin-top:16px;padding:11px 14px;border:1.5px solid var(--border);border-radius:10px;font-size:14px;font-family:inherit}
  .gate button{width:100%;margin-top:10px;padding:11px;border:none;border-radius:10px;background:var(--accent);color:#fff;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}
  footer{text-align:center;padding:24px;font-size:12px;color:var(--ink-muted)}
  @media(max-width:760px){.cards{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}}
</style></head><body>
<nav><div class="nav-in"><a href="https://theveil.media" class="logo"><div class="logo-mark"><svg viewBox="0 0 18 18" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="9" cy="9" r="7" stroke-dasharray="3 2"/><circle cx="9" cy="9" r="2.4" fill="currentColor" stroke="none"/></svg></div><span class="logo-text">The <span>Veil</span></span></a><span class="stamp" id="stamp">Growth</span></div></nav>
<div id="root"></div>
<footer id="foot">The Veil · private</footer>
<script>
var ACCENT = "#b07d1e";
var STATS_URL = "https://zujxdvzvcyzpyfqininu.supabase.co/functions/v1/admin";
function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

function gate(msg){
  document.getElementById("root").innerHTML =
    '<div class="gate"><h1>Growth dashboard</h1><p>'+esc(msg||"Enter your access key to continue.")+'</p>'+
    '<form method="get"><input type="password" name="key" placeholder="Access key" autofocus>'+
    '<button type="submit">View dashboard</button></form></div>';
}

function growthChart(daily){
  var W=900,H=240,PADL=34,PADR=14,PADT=14,PADB=26, iw=W-PADL-PADR, ih=H-PADT-PADB, n=daily.length;
  if(!n) return '<div class="empty">No signups yet.</div>';
  var maxCum=Math.max.apply(null,[1].concat(daily.map(function(d){return d.cum;})));
  var maxN=Math.max.apply(null,[1].concat(daily.map(function(d){return d.n;})));
  var x=function(i){return PADL+(n<=1?iw/2:(i/(n-1))*iw);};
  var yC=function(v){return PADT+ih-(v/maxCum)*ih;};
  var grid="";
  for(var t=0;t<=4;t++){ var v=Math.round((maxCum/4)*t), yy=yC(v);
    grid+='<line x1="'+PADL+'" y1="'+yy.toFixed(1)+'" x2="'+(W-PADR)+'" y2="'+yy.toFixed(1)+'" stroke="#e2e0dc" stroke-width="1"/>';
    grid+='<text x="'+(PADL-7)+'" y="'+(yy+3.5).toFixed(1)+'" text-anchor="end" font-size="10" fill="#7a7e8a">'+v+'</text>'; }
  var bw=Math.max(2,(iw/Math.max(n,1))*0.5), bars="";
  daily.forEach(function(d,i){ if(!d.n)return; var bh=(d.n/maxN)*(ih*0.42);
    bars+='<rect x="'+(x(i)-bw/2).toFixed(1)+'" y="'+(PADT+ih-bh).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+bh.toFixed(1)+'" rx="1.5" fill="'+ACCENT+'" opacity="0.18"/>'; });
  var pts=daily.map(function(d,i){return x(i).toFixed(1)+","+yC(d.cum).toFixed(1);});
  var line="M"+pts.join(" L");
  var area="M"+x(0).toFixed(1)+","+(PADT+ih).toFixed(1)+" L"+pts.join(" L")+" L"+x(n-1).toFixed(1)+","+(PADT+ih).toFixed(1)+" Z";
  var seen={}, xlabels=""; [0,Math.floor((n-1)/2),n-1].forEach(function(i){ if(seen[i])return; seen[i]=1;
    var mmdd=daily[i].d.slice(5).replace("-","/");
    xlabels+='<text x="'+x(i).toFixed(1)+'" y="'+(H-8)+'" text-anchor="middle" font-size="10" fill="#7a7e8a">'+mmdd+'</text>'; });
  var lastDot='<circle cx="'+x(n-1).toFixed(1)+'" cy="'+yC(daily[n-1].cum).toFixed(1)+'" r="4" fill="'+ACCENT+'"/>';
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Subscriber growth">'+
    '<defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="'+ACCENT+'" stop-opacity="0.20"/><stop offset="1" stop-color="'+ACCENT+'" stop-opacity="0"/></linearGradient></defs>'+
    grid+bars+'<path d="'+area+'" fill="url(#ga)"/><path d="'+line+'" fill="none" stroke="'+ACCENT+'" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>'+lastDot+xlabels+'</svg>';
}

function barRows(items){
  if(!items||!items.length) return '<div class="empty">Nothing yet.</div>';
  var max=Math.max.apply(null,[1].concat(items.map(function(i){return i.n;})));
  return '<div class="rows">'+items.map(function(i){ var pct=Math.round((i.n/max)*100);
    return '<div class="row"><div class="nm">'+esc(i.nm)+'</div><div class="bar"><i style="width:'+pct+'%"></i></div><div class="n">'+i.n+'</div></div>';
  }).join("")+'</div>';
}

function render(d){
  var t=d.totals, eng=d.engagement, dm=d.domains;
  var rs=d.recent_signups||[];
  var signupHtml = rs.length===0
    ? '<div class="empty">No new signups in the last 30 days.</div>'
    : '<div class="rows">'+rs.map(function(x){
        return '<div class="row"><div class="nm"><strong>'+esc(x.email)+'</strong>'+
          (x.name && x.name!=="" ? '<br><span style="color:#7a7e8a;font-size:12.5px">'+esc(x.name)+'</span>' : '')+
          '</div><div class="n" style="width:auto;min-width:150px;color:#7a7e8a;font-weight:600">'+esc(x.at)+(x.region?' &middot; '+esc(x.region):'')+'</div></div>';
      }).join("")+'</div>';
  var signupPanel = '<div class="panel"><h2>New signups &middot; last 30 days'+(rs.length?' &mdash; '+rs.length:'')+'</h2>'+signupHtml+'</div>';
  var ru=d.recent_unsubs||[], today=t.unsub_today||0;
  var unsubHtml = ru.length===0
    ? '<div class="empty">No unsubscribes yet. &#128079;</div>'
    : '<div class="rows">'+ru.map(function(x){
        return '<div class="row"><div class="nm"><strong>'+esc(x.email)+'</strong>'+
          (x.name && x.name!=="—" && x.name!=="" ? '<br><span style="color:#7a7e8a;font-size:12.5px">'+esc(x.name)+'</span>' : '')+
          '</div><div class="n" style="width:auto;min-width:120px;color:#7a7e8a;font-weight:600">'+esc(x.at)+'</div></div>';
      }).join("")+'</div>';
  var unsubPanel = '<div class="panel"'+(today>0?' style="border-color:#f2c6c2"':'')+'>'+
    '<h2>Recent unsubscribes'+(today>0?' &mdash; <span style="color:#c0392b">'+today+' today</span>':'')+'</h2>'+unsubHtml+'</div>';
  document.getElementById("stamp").textContent = "Updated "+d.generated_at;
  document.getElementById("foot").textContent = "Private dashboard · aggregates from Brevo, no data stored";
  var engHtml = (eng && eng.delivered>0)
    ? '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px">'+
        '<div class="card"><div class="k">Open rate</div><div class="v accent">'+eng.open+'%</div><div class="m">across '+eng.campaigns+' sends</div></div>'+
        '<div class="card"><div class="k">Click rate</div><div class="v green">'+eng.click+'%</div><div class="m">unique clicks / delivered</div></div>'+
        '<div class="card"><div class="k">Delivered</div><div class="v">'+eng.delivered.toLocaleString()+'</div><div class="m">newsletter emails</div></div>'+
      '</div><div style="margin-top:12px;color:#7a7e8a;font-size:12px">Click rate is the more reliable signal &mdash; Apple Mail privacy tends to inflate open rate.</div>'
    : '<div class="empty">No newsletter engagement data yet &mdash; stats appear here after the first sends land.</div>';
  document.getElementById("root").innerHTML =
    '<div class="wrap"><h1>Growth dashboard</h1><div class="sub">The Veil · live subscriber metrics (from Brevo)</div>'+
    '<div class="cards">'+
      '<div class="card"><div class="k">Active subscribers</div><div class="v accent">'+t.active+'</div><div class="m">confirmed &amp; receiving</div></div>'+
      '<div class="card"><div class="k">New this week</div><div class="v">'+t.new7+'</div><div class="m">last 7 days</div></div>'+
      '<div class="card"><div class="k">New this month</div><div class="v">'+t.new30+'</div><div class="m">last 30 days</div></div>'+
      '<div class="card"><div class="k">Regions</div><div class="v">'+t.regions+'</div><div class="m">time-zone waves in use</div></div>'+
      '<div class="card"><div class="k">Unsubscribes</div><div class="v">'+t.unsub+'</div><div class="m">blacklisted / opted out</div></div>'+
    '</div>'+
    signupPanel+
    '<div class="panel"><h2>Email engagement · opens &amp; clicks</h2>'+engHtml+'</div>'+
    unsubPanel+
    '<div class="panel"><h2>Subscriber growth · last 30 days</h2>'+growthChart(d.daily||[])+
      '<div class="legend"><span><i style="background:'+ACCENT+'"></i>Total subscribers (cumulative)</span><span><i style="background:'+ACCENT+';opacity:.18"></i>New signups / day</span></div></div>'+
    '<div class="panel"><h2>Companies &amp; email domains (all)</h2>'+
      '<div class="legend" style="margin-top:-2px;margin-bottom:14px;"><span><i style="background:'+ACCENT+'"></i><strong>'+dm.companyN+'</strong>&nbsp;from companies ('+dm.companyOrgs+' orgs)</span>'+
      '<span><i style="background:#7a7e8a"></i><strong>'+dm.personalN+'</strong>&nbsp;personal (Gmail, Apple, Outlook&hellip;)</span></div>'+
      barRows(dm.rows)+'</div>'+
    '<div class="grid2"><div class="panel"><h2>Regions</h2>'+barRows(d.regions)+'</div>'+
      '<div class="panel"><h2>Time zones</h2>'+barRows(d.timezones)+'</div></div>'+
    '</div>';
}

(function(){
  var key = new URLSearchParams(location.search).get("key") || "";
  if(!key){ gate(); return; }
  document.getElementById("root").innerHTML = '<div class="wrap"><div class="empty">Loading…</div></div>';
  fetch(STATS_URL+"?key="+encodeURIComponent(key))
    .then(function(r){ return r.json().catch(function(){return {ok:false};}); })
    .then(function(d){ if(d && d.ok) render(d); else gate("That key wasn't recognized. Try again."); })
    .catch(function(){ gate("Couldn't load stats. Try again."); });
})();
</script>
</body></html>
