<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!--
  Source template for og-card.png (1200x630 Open Graph / Twitter share card).
  Mirrors the editorial homepage identity: warm-white ground, indigo accent
  (#3b40a3), the dashed-circle "eye" mark, Playfair wordmark, Inter headline.
  Render:  Google Chrome --headless --screenshot=og-card.png --window-size=1200,630 ...
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;900&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --indigo:#3b40a3; --indigo-dim:#9aa0dd;
    --ink:#14151b; --ink-2:#484b55; --ink-muted:#83868f;
    --paper:#ffffff; --warm:#f2f1ec; --border:rgba(0,0,0,0.10);
    --serif:"Playfair Display",Georgia,serif;
    --sans:"Inter",-apple-system,system-ui,sans-serif;
    --mono:"Space Mono",ui-monospace,Menlo,monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1200px;height:630px;overflow:hidden}
  body{
    background:
      radial-gradient(1100px 640px at 50% -14%, rgba(59,64,163,0.11), transparent 66%),
      radial-gradient(760px 620px at 94% 108%, rgba(121,199,214,0.06), transparent 70%),
      linear-gradient(180deg,#ffffff 0%,#fbfaf7 100%);
    color:var(--ink);
    font-family:var(--sans);
    -webkit-font-smoothing:antialiased;
  }
  .card{
    width:1200px;height:630px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;
    padding:0 96px;
    position:relative;
  }
  /* thin editorial frame */
  .frame{position:absolute;inset:26px;border:1px solid var(--border);border-radius:18px;pointer-events:none}
  .corner{position:absolute;width:10px;height:10px;border:1.5px solid var(--indigo)}
  .corner.tl{top:26px;left:26px;border-right:0;border-bottom:0;border-top-left-radius:18px}
  .corner.tr{top:26px;right:26px;border-left:0;border-bottom:0;border-top-right-radius:18px}
  .corner.bl{bottom:26px;left:26px;border-right:0;border-top:0;border-bottom-left-radius:18px}
  .corner.br{bottom:26px;right:26px;border-left:0;border-top:0;border-bottom-right-radius:18px}

  .eyebrow{
    display:inline-flex;align-items:center;gap:10px;
    font-family:var(--mono);font-size:15px;font-weight:400;
    letter-spacing:.30em;text-transform:uppercase;color:var(--indigo);
    background:rgba(59,64,163,0.05);border:1px solid rgba(59,64,163,0.28);
    padding:11px 22px;border-radius:100px;margin-bottom:40px;
  }
  .eyebrow .dot{width:6px;height:6px;border-radius:50%;background:var(--indigo)}

  .lockup{display:flex;align-items:center;justify-content:center;gap:26px;margin-bottom:30px}
  .mark{
    width:84px;height:84px;border-radius:20px;background:var(--indigo);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 10px 30px rgba(59,64,163,0.28);
  }
  .mark svg{width:48px;height:48px}
  .wordmark{font-family:var(--serif);font-weight:700;font-size:112px;line-height:.9;letter-spacing:-0.01em;color:var(--ink)}

  .headline{
    font-family:var(--sans);font-weight:600;font-size:40px;letter-spacing:-0.02em;
    color:var(--ink-2);margin-bottom:34px;
  }
  .rule{width:64px;height:3px;background:var(--indigo);border-radius:2px;margin-bottom:34px}

  .footer{
    font-family:var(--mono);font-size:15px;font-weight:400;letter-spacing:.18em;
    text-transform:uppercase;color:var(--ink-muted);
  }
  .footer .sep{color:var(--indigo-dim);margin:0 14px}
</style>
</head>
<body>
  <div class="card">
    <div class="frame"></div>
    <span class="corner tl"></span><span class="corner tr"></span>
    <span class="corner bl"></span><span class="corner br"></span>

    <div class="eyebrow"><span class="dot"></span>Weekly UAP Intelligence</div>

    <div class="lockup">
      <div class="mark">
        <svg viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="9" cy="9" r="7" stroke="#fff" stroke-width="1.5" stroke-dasharray="3 2"/>
          <circle cx="9" cy="9" r="2.5" fill="#fff"/>
        </svg>
      </div>
      <div class="wordmark">The Veil</div>
    </div>

    <div class="headline">UAP news, scored for credibility.</div>
    <div class="rule"></div>

    <div class="footer">THEVEIL.MEDIA <span class="sep">·</span> NEW ISSUE EVERY SUNDAY EVENING</div>
  </div>
</body>
</html>
