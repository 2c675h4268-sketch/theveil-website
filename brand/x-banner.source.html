<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- X / Twitter header banner. 1500x500 (3:1). Light editorial ground to match
     the site. Key content kept centered/upper and clear of the bottom-left,
     where the circular profile photo overlaps. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@400;500;600&family=Space+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root{
    --indigo:#3b40a3; --indigo-dim:#9aa0dd;
    --ink:#14151b; --ink-2:#484b55; --ink-muted:#83868f; --border:rgba(0,0,0,0.10);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1500px;height:500px;overflow:hidden}
  body{
    background:
      radial-gradient(1200px 700px at 50% -30%, rgba(59,64,163,0.12), transparent 64%),
      radial-gradient(700px 560px at 96% 120%, rgba(121,199,214,0.07), transparent 70%),
      linear-gradient(180deg,#ffffff 0%,#faf9f6 100%);
    font-family:"Inter",-apple-system,system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;color:var(--ink);
  }
  .banner{width:1500px;height:500px;position:relative;display:flex;align-items:center;justify-content:center}

  .center{display:flex;flex-direction:column;align-items:center;text-align:center;margin-top:-6px}
  .eyebrow{
    font-family:"Space Mono",ui-monospace,monospace;font-size:16px;letter-spacing:.32em;
    text-transform:uppercase;color:var(--indigo);
    background:rgba(59,64,163,0.05);border:1px solid rgba(59,64,163,0.28);
    padding:9px 20px;border-radius:100px;margin-bottom:24px;
  }
  .lockup{display:flex;align-items:center;gap:22px;margin-bottom:18px}
  .mark{width:70px;height:70px;border-radius:17px;background:var(--indigo);display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(59,64,163,0.26)}
  .mark svg{width:40px;height:40px}
  .word{font-family:"Playfair Display",Georgia,serif;font-weight:700;font-size:92px;line-height:.9;letter-spacing:-0.01em;color:var(--ink)}
  .tagline{font-size:26px;font-weight:600;letter-spacing:-0.01em;color:var(--ink-2)}

  /* credibility-score signature, right side, subtle */
  .scores{position:absolute;right:70px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:16px;opacity:.9}
  .srow{display:flex;align-items:center;gap:12px;font-family:"Space Mono",monospace;font-size:13px;letter-spacing:.06em;color:var(--ink-muted)}
  .ring{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:"Inter",sans-serif;font-weight:700;font-size:17px}
  .r-hi{border:2.5px solid #2fae7a;color:#1f8f61}
  .r-mid{border:2.5px solid #d6a73a;color:#b5861f}
  .r-lo{border:2.5px solid #cf5b5b;color:#b13f3f}

  .foot{position:absolute;left:0;right:0;bottom:30px;text-align:center;font-family:"Space Mono",monospace;font-size:14px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-muted)}
</style>
</head>
<body>
  <div class="banner">
    <div class="center">
      <div class="eyebrow">Weekly UAP Intelligence</div>
      <div class="lockup">
        <div class="mark">
          <svg viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="9" cy="9" r="7" stroke="#fff" stroke-width="1.5" stroke-dasharray="3 2"/>
            <circle cx="9" cy="9" r="2.5" fill="#fff"/>
          </svg>
        </div>
        <div class="word">The Veil</div>
      </div>
      <div class="tagline">UAP news, scored for credibility.</div>
    </div>

    <div class="scores">
      <div class="srow"><div class="ring r-hi">85</div>Credible</div>
      <div class="srow"><div class="ring r-mid">60</div>Mixed</div>
      <div class="srow"><div class="ring r-lo">28</div>Unverified</div>
    </div>

    <div class="foot">THEVEIL.MEDIA &nbsp;·&nbsp; NEW ISSUE EVERY SUNDAY EVENING</div>
  </div>
</body>
</html>
